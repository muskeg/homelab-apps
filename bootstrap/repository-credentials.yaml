apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-github
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: argocd-github
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      type: Opaque
      data:
        type: git
        url: https://github.com/muskeg
        username: "{{ .username }}"
        password: "{{ .token }}"
  data:
    - secretKey: username
      remoteRef:
        key: argocd-github/username
    - secretKey: token
      remoteRef:
        key: argocd-github/token
