apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stonks
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: stonks.k8s.muskegg.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stonks
                port:
                  name: http
