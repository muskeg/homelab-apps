apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stonks-alpaca
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: stonks-alpaca
  data:
    - secretKey: ALPACA_API_KEY
      remoteRef:
        key: stonks/alpaca-api-key
    - secretKey: ALPACA_API_SECRET
      remoteRef:
        key: stonks/alpaca-api-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stonks-registry
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: stonks-registry
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: >-
          {"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: stonks/ghcr-username
    - secretKey: token
      remoteRef:
        key: stonks/ghcr-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stonks-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: stonks-oidc
  data:
    - secretKey: OIDC_ISSUER_URL
      remoteRef:
        key: stonks/oidc-issuer-url
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: stonks/oidc-client-id
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: stonks/oidc-client-secret
    - secretKey: OIDC_REDIRECT_URI
      remoteRef:
        key: stonks/oidc-redirect-uri
    - secretKey: OIDC_POST_LOGOUT_REDIRECT_URI
      remoteRef:
        key: stonks/oidc-post-logout-redirect-uri
    - secretKey: OIDC_COOKIE_SECURE
      remoteRef:
        key: stonks/oidc-cookie-secure
    - secretKey: SESSION_SECRET
      remoteRef:
        key: stonks/session-secret
