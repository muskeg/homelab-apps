apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: authentik-config
  data:
    - secretKey: AUTHENTIK_SECRET_KEY
      remoteRef:
        key: authentik/secret-key
    - secretKey: AUTHENTIK_POSTGRESQL__PASSWORD
      remoteRef:
        key: authentik/postgres-password
    - secretKey: AUTHENTIK_BOOTSTRAP_EMAIL
      remoteRef:
        key: authentik/bootstrap-email
    - secretKey: AUTHENTIK_BOOTSTRAP_PASSWORD
      remoteRef:
        key: authentik/bootstrap-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-postgresql
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: authentik-postgresql
  data:
    - secretKey: password
      remoteRef:
        key: authentik/postgres-password
    - secretKey: postgres-password
      remoteRef:
        key: authentik/postgres-password
    - secretKey: replication-password
      remoteRef:
        key: authentik/postgres-password
