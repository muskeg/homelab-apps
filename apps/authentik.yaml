apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://charts.goauthentik.io
      chart: authentik
      targetRevision: 2026.8.6
      helm:
        releaseName: authentik
        valueFiles:
          - $values/workloads/authentik/values.yaml
    - repoURL: https://github.com/muskeg/homelab-apps.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/muskeg/homelab-apps.git
      targetRevision: main
      path: workloads/authentik
  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
